<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="proctusGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A227" />
      <stop offset="100%" stop-color="#E5C158" />
    </linearGradient>
    <linearGradient id="proctusNavy" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#07142E" />
      <stop offset="100%" stop-color="#0A1F44" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#C9A227" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background container with soft rounded corners -->
  <rect width="512" height="512" rx="112" fill="#0A1F44" />
  <!-- Background subtle financial grid lines -->
  <path d="M64 416 H448 M64 336 H448 M64 256 H448 M64 176 H448 M64 96 H448" stroke="#1D3557" stroke-width="2" stroke-dasharray="4 8" opacity="0.4" />
  <!-- Monogramme "P" avec courbe boursiere et fleche vers le haut -->
  <g filter="url(#subtleGlow)" transform="translate(48, 40)">
    <!-- Hampe gauche montante -->
    <path d="M120 400 L120 120" stroke="#3A6EA5" stroke-width="44" stroke-linecap="round" />
    <!-- Fleche pointant vers le haut -->
    <path d="M84 140 L120 70 L156 140 Z" fill="#3A6EA5" />
    <!-- Courbe droite ascendante Or -->
    <path d="M120 100 C250 100 320 150 320 220 C320 290 240 330 120 330" fill="none" stroke="url(#proctusGold)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Courbe d'impulsion boursiere interne doree -->
    <path d="M120 310 C180 300 240 260 260 220 C280 180 240 140 160 130" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.6" />
    <!-- Point pivot / etoile financiere au sommet de la courbe -->
    <circle cx="280" cy="170" r="12" fill="#F4A261" />
    <circle cx="280" cy="170" r="6" fill="#FFFFFF" />
  </g>
</svg>
